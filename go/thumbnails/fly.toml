# Deploy from this directory: fly launch --no-deploy --copy-config
# If the app name is taken, change `app` before launching.
app = "kura-thumbnails"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
